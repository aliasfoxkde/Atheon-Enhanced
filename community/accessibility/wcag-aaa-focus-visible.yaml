name: wcag-aaa-focus-visible
match: outline:\s*none|outline:\s*0|focus:\s*none|focus:\s*0
severity: high
description: 'WCAG AAA: Enhanced focus indication. AAA requires visible focus indicators with 3:1 contrast ratio against adjacent colors. Never remove outline without providing alternative.'

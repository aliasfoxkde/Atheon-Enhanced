name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    # Only same-repo PRs (e.g. dependabot, owner branches). Fork PRs must
    # go through explicit human review — auto-merge should never fire on
    # untrusted contributor code without a manual approval step.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check CI status checks have passed
        id: check
        run: |
          # Wait for the branch-protection check-runs themselves. The legacy
          # commit-status endpoint does not include GitHub Actions check-runs,
          # and mergeable_state remains `blocked` while required checks settle.
          # Native `gh pr merge --auto` is the final server-side guard.
          for i in $(seq 1 30); do
            pr_head_sha=$(gh api repos/${REPO}/pulls/${PR_NUMBER} --jq '.head.sha')
            mergeable=$(gh api repos/${REPO}/pulls/${PR_NUMBER} --jq '.mergeable')
            mergeable_state=$(gh api repos/${REPO}/pulls/${PR_NUMBER} --jq '.mergeable_state')
            echo "Attempt $i/30: mergeable=${mergeable}, mergeable_state=${mergeable_state}"

            if [ "${mergeable}" = "false" ] || [ "${mergeable_state}" = "dirty" ]; then
              echo "PR has merge conflicts — refusing to auto-merge"
              exit 1
            fi

            check_runs=$(gh api "repos/${REPO}/commits/${pr_head_sha}/check-runs")
            pending=0
            failed=0
            while IFS= read -r required_context; do
              [ -n "${required_context}" ] || continue
              # Branch protection stores workflow-prefixed contexts such as
              # `CI / Test (Go 1.24)`; check-runs expose `Test (Go 1.24)`.
              check_name="${required_context#* / }"
              result=$(jq -r --arg name "${check_name}" \
                '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at) | last | if .status == "completed" and .conclusion == "success" then "success" elif .status == "completed" then ("failed:" + (.conclusion // "unknown")) else "pending" end' <<<"${check_runs}")
              echo "  ${required_context}: ${result}"
              case "${result}" in
                success) ;;
                pending) pending=1 ;;
                *) failed=1 ;;
              esac
            done < <(gh api "repos/${REPO}/branches/main/protection/required_status_checks" --jq '.contexts[]')

            if [ "${failed}" -eq 1 ]; then
              echo "A required check failed — refusing to auto-merge"
              exit 1
            fi
            if [ "${pending}" -eq 0 ]; then
              echo "All required check-runs passed; native auto-merge will enforce final policy"
              exit 0
            fi

            echo "Required check-runs are still pending — waiting 30s..."
            sleep $((20 + RANDOM % 21))
          done
          echo "TIMEOUT: required check-runs did not all complete within 15 minutes"
          exit 1

      - name: Enable auto-merge
        if: steps.check.outcome == 'success'
        run: |
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPO}" \
            --squash \
            --delete-branch \
            --auto

  report-conflicts:
    name: Report Conflicts
    runs-on: ubuntu-latest
    if: github.event.pull_request.mergeable == false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Comment on conflicting PR
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "This PR has merge conflicts. Please resolve them before merging."
